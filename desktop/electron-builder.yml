appId: com.earendil-works.pi-go-desktop
productName: Pi-Go
copyright: Copyright © 2024 Earendil Works

directories:
  output: release
  buildResources: build

# Files to include in the app
files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - "!node_modules"
  - "!src"

# Go binary — placed in Contents/Resources/ (not inside asar)
extraResources:
  - from: "../pi-agent"
    to: "pi-agent"

# macOS specific
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  # icon: build/icon.icns

dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
